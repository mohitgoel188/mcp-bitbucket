[project]
name = "mcp-bitbucket"
version = "0.2.0"
description = "An MCP server for Bitbucket Cloud: pull request review, repository and source tools, plus a searchable index of every REST endpoint."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
license-files = ["LICENSE"]
authors = [{ name = "Mohit Goel", email = "mohitgoel188@gmail.com" }]
keywords = ["mcp", "model-context-protocol", "bitbucket", "claude", "code-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Software Development :: Version Control :: Git",
]
dependencies = [
    "mcp>=2.1.1",
    "requests>=2.31.0",
]

[project.urls]
Homepage = "https://github.com/mohitgoel188/mcp-bitbucket"
Repository = "https://github.com/mohitgoel188/mcp-bitbucket"
Issues = "https://github.com/mohitgoel188/mcp-bitbucket/issues"

[project.scripts]
mcp-bitbucket = "mcp_bitbucket:main"

[dependency-groups]
dev = [
    "ruff>=0.16.0",
    "coverage>=7.6.0",
]

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/mcp_bitbucket"]
# endpoints.json is the generated endpoint index. A wheel without it leaves
# bb_list_endpoints permanently empty, so it is called out explicitly rather
# than left to default data-file inclusion.
artifacts = ["src/mcp_bitbucket/endpoints.json"]

[tool.ruff]
line-length = 88
target-version = "py312"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B", "SIM"]
# `ruff format` owns line length, and it cannot split the long description
# strings that make up most of the tool schemas. Flagging them adds noise
# without changing anything a formatter run would fix.
ignore = ["E501"]
